name: CI — Java

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  config:
    name: Detect Java sources
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.java.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: java
        # hashFiles hanya boleh di level STEP (job-level `if` membuat workflow
        # ditolak GitHub -> startup_failure). Sumber Java ada di ports/java/.
        if: ${{ hashFiles('pom.xml', 'ports/java/src/main/java/**/*.java') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  test:
    needs: config
    if: needs.config.outputs.java == 'true'
    name: Test — Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    # fail-fast: false — Java 21 tetap dieksekusi walau Java 17 merah,
    # agar kegagalan per-versi terlihat (dulu 21 selalu 'cancelled').
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '${{ matrix.java }}'
          distribution: temurin
          cache: maven
      - run: mvn -B test --file pom.xml
      - run: mvn -B verify --file pom.xml
