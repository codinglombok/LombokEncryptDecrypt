name: CI — Python

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  config:
    name: Detect Python sources & crate readiness
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.py.outputs.exists }}
      crate: ${{ steps.crate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: py
        # hashFiles hanya boleh di level STEP (job-level `if` membuat workflow
        # ditolak GitHub -> startup_failure)
        if: ${{ hashFiles('ports/python/**/*.py') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: crate
        # `maturin develop` mengompilasi crate Rust — job test baru berjalan
        # ketika crate Rust siap dikompilasi:
        #  1. entry point crate ada (src/lib.rs ATAU override `path` di
        #     [lib] Cargo.toml — saat ini src-rust/lib.rs TANPA override path,
        #     sehingga cargo mencari src/lib.rs yang tidak ada), dan
        #  2. semua deklarasi `mod` di lib.rs punya filenya.
        # Saat ini 24 modul dideklarasikan tetapi hanya ct yang ada, jadi job
        # test di-skip (bukan merah) sampai core Rust dituntaskan.
        run: |
          READY=true
          [ -f src-rust/lib.rs ] || READY=false
          if [ "$READY" = true ]; then
            grep -A3 '^\[lib\]' Cargo.toml | grep -q 'path[[:space:]]*=' || [ -f src/lib.rs ] || READY=false
          fi
          if [ "$READY" = true ]; then
            for m in $(grep -hE '^[[:space:]]*(pub )?mod [a-zA-Z_0-9]+' src-rust/lib.rs | sed -E 's/.*mod[[:space:]]+([a-zA-Z_0-9]+).*/\1/'); do
              [ -f "src-rust/$m.rs" ] || [ -f "src-rust/$m/mod.rs" ] || READY=false
            done
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

  test:
    needs: config
    if: needs.config.outputs.python == 'true' && needs.config.outputs.crate == 'true'
    name: Test — Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install maturin pytest
      - run: maturin develop --features python
      - run: pytest ports/python/tests/ -v

  safety:
    needs: config
    if: needs.config.outputs.python == 'true'
    name: Python safety audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install safety
      - run: safety check
