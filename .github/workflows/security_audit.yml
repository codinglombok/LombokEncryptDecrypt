name: Security Audit — All Stacks

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly Monday 03:00 UTC
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'composer.json'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  config:
    name: Detect auditable stacks
    runs-on: ubuntu-latest
    outputs:
      cargo: ${{ steps.cargo.outputs.audit_ready }}
      python: ${{ steps.python.outputs.exists }}
      go: ${{ steps.go.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: cargo
        # hashFiles hanya boleh di level STEP (job-level `if` membuat workflow
        # ditolak GitHub -> startup_failure). Terverifikasi lokal: tanpa entry
        # point crate, `cargo generate-lockfile` pun menolak mem-parsing
        # manifest ("can't find library ... or specify lib.path") — jadi gate
        # audit bukan sekadar Cargo.toml, melainkan entry point ada:
        # src/lib.rs ATAU override `path` di blok [lib] Cargo.toml.
        run: |
          if [ -f src/lib.rs ] || grep -A3 '^\[lib\]' Cargo.toml | grep -q 'path[[:space:]]*='; then
            echo "audit_ready=true" >> "$GITHUB_OUTPUT"
          fi
      - id: python
        if: ${{ hashFiles('pyproject.toml', 'ports/python/requirements*.txt') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: go
        if: ${{ hashFiles('ports/go/**/*.go') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # Runtime dependencies only: the library itself is zero-dependency, so
      # this reflects real (shippable) exposure. Dev-toolchain advisories in
      # jest/ts-jest transitive deps have no upstream fix yet and are tracked
      # via Dependabot alerts instead.
      - run: npm audit --omit=dev --audit-level=moderate

  cargo-audit:
    needs: config
    if: needs.config.outputs.cargo == 'true'
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cargo.lock tidak di-commit (library crate) — dibuat on-the-fly hanya
      # untuk resolusi versi; cargo-audit tidak mengompilasi kode.
      - run: cargo generate-lockfile
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  cargo-deny:
    needs: config
    if: needs.config.outputs.cargo == 'true'
    name: cargo deny (license + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-deny menyelesaikan dependensinya sendiri bila Cargo.lock absen.
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          log-level: warn
          command: check

  python-safety:
    needs: config
    if: needs.config.outputs.python == 'true'
    name: Python safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install safety
      - run: safety check

  govulncheck:
    needs: config
    if: needs.config.outputs.go == 'true'
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: ports/go

  codeql:
    name: CodeQL (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Hanya javascript-typescript: tidak ada source C++ terkompilasi di repo
      # (ports/cpp baru header + vcpkg.json) — CodeQL C++ butuh build nyata
      # dan input `languages` harus SATU string (YAML flow-style
      # `{ languages: javascript-typescript, cpp }` dulu menciptakan input
      # "cpp" yang tidak dikenal -> job gagal). Tambahkan kembali cpp
      # (di-quote: "javascript-typescript,cpp") begitu ada kode C++ nyata.
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
