name: Publish — NuGet

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  config:
    name: Detect .NET projects
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.dotnet.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: dotnet
        # hashFiles hanya boleh di level STEP (job-level `if` membuat workflow
        # ditolak GitHub -> startup_failure)
        if: ${{ hashFiles('*.csproj', 'ports/dotnet/**/*.csproj') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  publish-nuget:
    needs: config
    if: needs.config.outputs.dotnet == 'true'
    name: Publish to NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0' }
      - run: dotnet build --configuration Release
      - run: dotnet pack --configuration Release --output ./artifacts
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - run: dotnet nuget push ./artifacts/*.snupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
