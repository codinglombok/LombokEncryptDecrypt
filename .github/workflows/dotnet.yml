name: CI — .NET

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  config:
    name: Detect .NET projects
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.dotnet.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: dotnet
        # hashFiles hanya boleh di level STEP (job-level `if` membuat workflow
        # ditolak GitHub -> startup_failure)
        if: ${{ hashFiles('*.csproj', 'ports/dotnet/**/*.csproj') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    if: needs.config.outputs.dotnet == 'true'
    name: Build — .NET ${{ matrix.dotnet }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        dotnet: ['8.0', '9.0']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ matrix.dotnet }}' }
      - run: dotnet build LombokEncryptDecrypt.csproj --configuration Release
      # Catatan: belum ada proyek test C# (ports/dotnet/ tidak ada). Tambahkan
      # kembali `dotnet test` di sini begitu proyek test dibuat.
