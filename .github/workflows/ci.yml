name: CI — TypeScript

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # weekly Monday 02:00 UTC

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check 'src/**/*.ts' 'tests/**/*.ts'

  test:
    # OS di nama job — tanpa ini 6 leg matrix berbagi satu nama check dan
    # kegagalan per-OS tidak bisa dibedakan di sidebar PR.
    name: Test — Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    # Bun/glibc macOS pernah menggantung 45+ menit tanpa satu test pun
    # gagal tercatat — batasi durasi job dan upload bukti saat gagal.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test (jest + coverage, JSON report untuk diagnosa)
        run: |
          set -o pipefail
          npm test -- --coverage --ci --json --outputFile=jest-results.json 2>&1 | tee jest-output.log
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-${{ matrix.node }}-${{ matrix.os }}
          path: |
            jest-results.json
            jest-output.log
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v4
        if: matrix.node == '22' && matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: typescript

  # Ecosystem integrations — the REAL published lombokvector/lomboksimhash
  # packages under a real ESM loader (jest CJS cannot load ESM-only deps).
  ecosystem:
    name: Ecosystem integrations (node ESM)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx tsx --test tests/ecosystem/*.test.ts

  vectors:
    name: NIST Test Vectors
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run test:vectors -- --verbose
        env:
          LOMBOK_VERIFY_NIST_CAVP: 'true'

  deno:
    name: Deno compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with: { deno-version: v2.x }
      - name: Deno test (jest-style BDD via preload shim)
        run: |
          # Direktori eksplisit — tests/ecosystem/ memakai node:test + paket
          # peer asli (node_modules tidak dipasang di job Deno).
          deno test --allow-read --allow-env \
            tests/unit/ tests/integration/ tests/vectors/ \
            --import-map=deno_import_map.json \
            --unstable-sloppy-imports \
            --no-check \
            --preload tests/deno-bdd.ts

  bun:
    name: Bun compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pin: bun "latest" pernah mengubah perilaku antar minor. 1.4.4
      # terverifikasi hijau (348 pass) — naikkan versi secara sadar, bukan
      # karena runner berubah di balik layar.
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: '1.4.4' }
      - run: bun install
      - name: Bun test (output untuk diagnosa)
        run: |
          set -o pipefail
          bun test 2>&1 | tee bun-output.log
      - name: Upload bun diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bun-diagnostics
          path: bun-output.log
          if-no-files-found: ignore
