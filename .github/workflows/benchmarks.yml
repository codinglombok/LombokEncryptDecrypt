name: Benchmarks (PR comment)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  bench-ts:
    name: TypeScript benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm }
      - run: npm ci && npm run build
      - run: npm run bench:all 2>&1 | tee bench_ts.txt
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('bench_ts.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📊 TypeScript Benchmark Results\n```\n' + out.slice(-3000) + '\n```'
            });
