name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # v4 = manifest-only: seluruh opsi (release-type, package-name,
          # changelog-path, extra-files, ...) dibaca dari config-file.
          # Input lain di `with:` diabaikan action ("Unexpected input(s)").
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Tag created
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Released version: ${{ steps.release.outputs.tag_name }}"
          echo "Major: ${{ steps.release.outputs.major }}"
          echo "Minor: ${{ steps.release.outputs.minor }}"
          echo "Patch: ${{ steps.release.outputs.patch }}"
