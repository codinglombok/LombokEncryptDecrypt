name: Fuzz — LombokFuzzer nightly

on:
  schedule:
    - cron: '0 0 * * *'   # nightly 00:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration per target (seconds)'
        required: false
        default: '300'

permissions:
  contents: read
  issues: write

jobs:
  config:
    name: Detect fuzz targets & crate readiness
    runs-on: ubuntu-latest
    outputs:
      fuzz: ${{ steps.fuzz.outputs.exists }}
      crate: ${{ steps.crate.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - id: fuzz
        # hashFiles hanya boleh di level STEP (job-level `if` membuat workflow
        # ditolak GitHub -> startup_failure). Direktori fuzz/ belum ada.
        if: ${{ hashFiles('fuzz/**') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: crate
        # dudect mengompilasi crate Rust — berjalan hanya ketika crate siap:
        # entry point ada (src/lib.rs ATAU override `path` di [lib] Cargo.toml)
        # dan semua deklarasi `mod` di lib.rs punya filenya. Menjaga jadwal
        # nightly tetap hijau (skip) sampai core Rust dituntaskan.
        run: |
          READY=true
          [ -f src-rust/lib.rs ] || READY=false
          if [ "$READY" = true ]; then
            grep -A3 '^\[lib\]' Cargo.toml | grep -q 'path[[:space:]]*=' || [ -f src/lib.rs ] || READY=false
          fi
          if [ "$READY" = true ]; then
            for m in $(grep -hE '^[[:space:]]*(pub )?mod [a-zA-Z_0-9]+' src-rust/lib.rs | sed -E 's/.*mod[[:space:]]+([a-zA-Z_0-9]+).*/\1/'); do
              [ -f "src-rust/$m.rs" ] || [ -f "src-rust/$m/mod.rs" ] || READY=false
            done
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: config
    if: needs.config.outputs.fuzz == 'true'
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_aes_gcm
          - fuzz_rsa_oaep
          - fuzz_pem_parser
          - fuzz_x509
          - fuzz_kyber
          - fuzz_kdf
          - fuzz_stream
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src }
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzzer — ${{ matrix.target }}
        run: |
          DURATION=${{ github.event.inputs.duration || '300' }}
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=$DURATION \
            -jobs=4 \
            -workers=4

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/

      - name: File issue on crash (deduplicated)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const target = '${{ matrix.target }}';
            const title = `🐛 Fuzz crash: ${target}`;
            // Satu crash yang sama tidak boleh membanjiri tracker: cari
            // issue OPEN berjudul identik terlebih dahulu. Tambah komentar
            // pada issue yang ada agar jejak run tetap tersimpan.
            const existing = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${target}"`,
              per_page: 100,
            });
            const dup = existing.find((i) => i.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Crash terdeteksi lagi pada run: ${runUrl}`,
              });
              core.notice(`Issue #${dup.number} sudah ada untuk ${target} — tidak membuat duplikat.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Fuzzer found a crash in \`${target}\`. See workflow run: ${runUrl}`,
              labels: ['bug', 'fuzz', 'security'],
            });

  dudect:
    needs: config
    if: needs.config.outputs.crate == 'true'
    name: Side-channel statistical test (dudect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features full -- dudect --nocapture
