name: CI — Rust

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: '-D warnings'

jobs:
  config:
    name: Detect Rust crate readiness
    runs-on: ubuntu-latest
    outputs:
      audit_ready: ${{ steps.crate.outputs.audit_ready }}
      ready: ${{ steps.crate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        # hashFiles hanya boleh di level STEP (job-level `if` membuat workflow
        # ditolak GitHub -> startup_failure)
        if: ${{ hashFiles('Cargo.toml', 'src-rust/**/*.rs') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: crate
        # Dua tier kesiapan crate (terverifikasi lokal: tanpa entry point,
        # `cargo generate-lockfile` pun menolak mem-parsing manifest):
        #  audit_ready — entry point ada (src/lib.rs ATAU override `path` di
        #    [lib]); cukup untuk generate-lockfile + cargo audit (tanpa kompilasi).
        #  ready — audit_ready + semua deklarasi `mod` di lib.rs punya filenya
        #    (24 modul dideklarasikan, baru ct yang ada); syarat kompilasi.
        # Saat ini keduanya false karena src-rust/lib.rs TANPA override path
        # sehingga cargo mencari src/lib.rs yang tidak ada. Skip berwarna
        # abu-abu, bukan dinding X merah.
        run: |
          ENTRY=true
          [ -f src/lib.rs ] || grep -A3 '^\[lib\]' Cargo.toml | grep -q 'path[[:space:]]*=' || ENTRY=false
          READY=$ENTRY
          if [ "$READY" = true ]; then
            for m in $(grep -hE '^[[:space:]]*(pub )?mod [a-zA-Z_0-9]+' src-rust/lib.rs | sed -E 's/.*mod[[:space:]]+([a-zA-Z_0-9]+).*/\1/'); do
              [ -f "src-rust/$m.rs" ] || [ -f "src-rust/$m/mod.rs" ] || READY=false
            done
          fi
          echo "audit_ready=$ENTRY" >> "$GITHUB_OUTPUT"
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

  test:
    needs: config
    if: needs.config.outputs.ready == 'true'
    name: Test — Rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            toolchain: stable
            coverage: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --manifest-path Cargo.toml --features full

      - name: Run tests (no_std)
        run: cargo test --manifest-path Cargo.toml --no-default-features --features no_std,symmetric,hash

      - name: Clippy
        run: cargo clippy --manifest-path Cargo.toml --features full -- -D warnings

      - name: Rustfmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --manifest-path Cargo.toml -- --check

      - name: Install cargo-llvm-cov
        if: matrix.coverage
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage
        if: matrix.coverage
        run: cargo llvm-cov --manifest-path Cargo.toml --features full --lcov --output-path lcov.info

      - uses: codecov/codecov-action@v4
        if: matrix.coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust

  wasm:
    needs: config
    if: needs.config.outputs.ready == 'true'
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --target web --out-dir dist/wasm --features wasm

  cross:
    needs: config
    if: needs.config.outputs.ready == 'true'
    name: Cross-compile — ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - riscv64gc-unknown-linux-gnu
          - thumbv7em-none-eabihf   # ARM Cortex-M (embedded no_std)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - name: Cross-build
        run: cross build --target ${{ matrix.target }} --no-default-features --features no_std,symmetric,hash

  audit:
    needs: config
    # audit hanya butuh manifest yang bisa di-parsing (entry point ada) untuk
    # generate-lockfile — TIDAK butuh kompilasi. Saat ini entry point belum
    # ada -> job skip; aktif otomatis begitu [lib].path atau src/lib.rs hadir.
    if: needs.config.outputs.audit_ready == 'true'
    name: Security Audit (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cargo.lock tidak di-commit (library crate) — dibuat on-the-fly hanya
      # untuk resolusi versi; cargo-audit tidak mengompilasi kode.
      - run: cargo generate-lockfile
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  benchmark:
    needs: config
    # Dua `if` lama digabung (key duplikat ditolak parser): siap-kompilasi
    # DAN hanya pada pull_request.
    if: needs.config.outputs.ready == 'true' && github.event_name == 'pull_request'
    name: Benchmark (delta check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-criterion --locked
      - run: cargo criterion --manifest-path Cargo.toml 2>&1 | tee bench_output.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('bench_output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🦀 Rust Benchmark Results\n```\n' + output + '\n```'
            });
