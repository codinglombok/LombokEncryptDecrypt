name: CI — Rust

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: '-D warnings'

jobs:
  test:
    name: Test — Rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            toolchain: stable
            coverage: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --manifest-path Cargo.toml --features full

      - name: Run tests (no_std)
        run: cargo test --manifest-path Cargo.toml --no-default-features --features no_std,symmetric,hash

      - name: Clippy
        run: cargo clippy --manifest-path Cargo.toml --features full -- -D warnings

      - name: Rustfmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --manifest-path Cargo.toml -- --check

      - name: Install cargo-llvm-cov
        if: matrix.coverage
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage
        if: matrix.coverage
        run: cargo llvm-cov --manifest-path Cargo.toml --features full --lcov --output-path lcov.info

      - uses: codecov/codecov-action@v4
        if: matrix.coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --target web --out-dir dist/wasm --features wasm

  cross:
    name: Cross-compile — ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - riscv64gc-unknown-linux-gnu
          - thumbv7em-none-eabihf   # ARM Cortex-M (embedded no_std)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cross --locked
      - name: Cross-build
        run: cross build --target ${{ matrix.target }} --no-default-features --features no_std,symmetric,hash

  audit:
    name: Security Audit (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  benchmark:
    name: Benchmark (delta check)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-criterion --locked
      - run: cargo criterion --manifest-path Cargo.toml 2>&1 | tee bench_output.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('bench_output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🦀 Rust Benchmark Results\n```\n' + output + '\n```'
            });
