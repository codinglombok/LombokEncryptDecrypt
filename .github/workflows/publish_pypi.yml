name: Publish — PyPI

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  config:
    name: Detect Python sources
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.python.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: python
        # hashFiles hanya boleh di level STEP (job-level `if` = startup_failure)
        if: ${{ hashFiles('ports/python/**/*.py') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: config
    if: needs.config.outputs.python == 'true'
    name: Build wheels + publish to PyPI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install maturin
      - run: maturin build --release --features python --out dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
