name: CI — WASM

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-wasm:
    if: ${{ hashFiles('src/**/*.rs') != '' }}
    name: WASM build + browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build --target web --out-dir dist/wasm --features wasm
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Browser test (Node WASM emulation)
        run: npm run test -- --testPathPattern=wasm
