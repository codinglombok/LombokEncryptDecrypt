name: Publish — CPAN (Perl)

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  config:
    name: Detect Perl sources
    runs-on: ubuntu-latest
    outputs:
      perl: ${{ steps.perl.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: perl
        # hashFiles hanya boleh di level STEP (job-level `if` = startup_failure)
        if: ${{ hashFiles('ports/perl/**') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  publish-cpan:
    needs: config
    if: needs.config.outputs.perl == 'true'
    name: Publish to CPAN via PAUSE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: perl-actions/install-with-cpanm@stable
        with: { install: 'CPAN::Uploader' }
      - run: |
          cd ports/perl
          perl Makefile.PL
          make dist
      - run: |
          cpan-upload -u ${{ secrets.PAUSE_USERNAME }} \
                      -p ${{ secrets.PAUSE_PASSWORD }} \
                      ports/perl/LombokEncryptDecrypt-*.tar.gz
