name: Publish — Maven Central

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  config:
    name: Detect Java sources
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.java.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: java
        # hashFiles hanya boleh di level STEP (job-level `if` = startup_failure)
        if: ${{ hashFiles('pom.xml', 'ports/java/src/main/java/**/*.java') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  publish-maven:
    needs: config
    if: needs.config.outputs.java == 'true'
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      # CATATAN SEMANTIK: pom.xml belum punya profil `release` maupun
      # distributionManagement target Central — step ini akan gagal di deploy
      # sampai konfigurasi Central (sonatype/central-publishing) ditambahkan.
      # Mirror GPR yang berfungsi ada di release-github.yml (profil -Pgpr).
      - run: mvn -B deploy -P release
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
