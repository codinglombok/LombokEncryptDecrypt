name: Publish — Packagist (PHP)

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  config:
    name: Detect PHP sources
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.php.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: php
        # hashFiles hanya boleh di level STEP (job-level `if` = startup_failure)
        if: ${{ hashFiles('ports/php/**/*.php') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  trigger-packagist:
    needs: config
    if: needs.config.outputs.php == 'true'
    name: Trigger Packagist update
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist
        run: |
          curl -XPOST -H'content-type:application/json' \
            'https://packagist.org/api/update-package?username=codinglombok&apiToken=${{ secrets.PACKAGIST_TOKEN }}' \
            -d'{"repository":{"url":"https://github.com/codinglombok/LombokEncryptDecrypt"}}'
