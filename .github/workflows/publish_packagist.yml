name: Publish — Packagist (PHP)

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  trigger-packagist:
    name: Trigger Packagist update
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist
        run: |
          curl -XPOST -H'content-type:application/json' \
            'https://packagist.org/api/update-package?username=codinglombok&apiToken=${{ secrets.PACKAGIST_TOKEN }}' \
            -d'{"repository":{"url":"https://github.com/codinglombok/LombokEncryptDecrypt"}}'
