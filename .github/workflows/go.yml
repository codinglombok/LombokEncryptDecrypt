name: CI — Go

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  config:
    name: Detect Go sources
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.go.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - id: go
        # hashFiles hanya boleh di level STEP (job-level `if` membuat workflow
        # ditolak GitHub -> startup_failure)
        if: ${{ hashFiles('ports/go/**/*.go') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  test:
    needs: config
    if: needs.config.outputs.go == 'true'
    name: Test — Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '${{ matrix.go }}' }
      - run: go mod download
        working-directory: ports/go
      - run: go test ./... -v -race -coverprofile=coverage.out
        working-directory: ports/go
      - run: go vet ./...
        working-directory: ports/go

  govulncheck:
    needs: config
    if: needs.config.outputs.go == 'true'
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.23' }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: ports/go
